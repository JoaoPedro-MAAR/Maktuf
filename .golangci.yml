run:
  timeout: 5m
  tests: true

linters:
  enable:
    - gofmt
    - goimports
    - misspell
    - revive
    - gocritic

linters-settings:
  goimports:
    local-prefixes: github.com/JoaoPedro-MAAR/Maktuf
  misspell:
    ignore-words:
      - clientes
      - sensores
  revive:
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf
      - name: empty-block
      - name: superfluous-else
      - name: unused-parameter
      - name: unreachable-code
      - name: redefines-builtin-id

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
